name: Hämta

on:
  # Startas av Supabase (pg_cron, schemat finns i supabase/hamtning.sql) eller manuellt.
  # GitHubs egen schedule används inte – den hoppade över de flesta körningarna.
  workflow_dispatch:
    inputs:
      delar:
        description: "Delar att hämta, t.ex. \"nyheter bors\" (tomt = allt)"
        required: false
        default: ""

# Kör aldrig två hämtningar samtidigt.
concurrency:
  group: hamta
  cancel-in-progress: false

jobs:
  hamta:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: fetch/requirements.txt
      # Poppler behövs bara för lunch-PDF:en.
      - if: inputs.delar == ''
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: pip install -r fetch/requirements.txt
      - run: python fetch/main.py $DELAR
        env:
          DELAR: ${{ inputs.delar }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
