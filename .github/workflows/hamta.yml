name: Hämta

on:
  schedule:
    # Vardagar 05:17–08:17 UTC (06–09 vintertid, 07–10 sommartid i Stockholm).
    # Menyn byts måndag morgon, så vi hämtar flera gånger.
    - cron: "17 5-8 * * 1-5"
  workflow_dispatch:

jobs:
  hamta:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: fetch/requirements.txt
      - run: sudo apt-get install -y poppler-utils
      - run: pip install -r fetch/requirements.txt
      - run: python fetch/main.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
