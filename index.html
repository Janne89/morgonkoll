<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Morgonkoll</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☕</text></svg>">
<style>
  :root {
    --bg: #f4f2ee;
    --kort: #ffffff;
    --text: #1d1d1f;
    --dampad: #6b6b70;
    --linje: #e4e1db;
    --accent: #c2562b;
    --temp: #d9622b;
    --regn: #3b82c4;
    --markering: #fbeee6;
    --upp: #1a7f45;
    --ned: #c0352b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141416;
      --kort: #1e1e21;
      --text: #ececee;
      --dampad: #9a9aa2;
      --linje: #2f2f34;
      --accent: #f08a5d;
      --temp: #f39a64;
      --regn: #6aa9e0;
      --markering: #3a2a22;
      --upp: #4cc27e;
      --ned: #f07167;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 960px; margin: 0 auto; padding: 24px 16px 48px; }
  header { margin-bottom: 20px; }
  h1 { margin: 0; font-size: 28px; letter-spacing: -0.02em; }
  .datum { color: var(--dampad); margin-top: 2px; }
  .dagsinfo { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 6px; font-size: 14px; color: var(--dampad); }
  .dagsinfo:empty { display: none; }
  .dagsinfo .speciell { color: var(--accent); font-weight: 600; }
  .rutnat { display: flex; flex-direction: column; gap: 16px; }
  .kolumn { display: contents; }
  /* Mobil: kompakta kort först, lunchen sist. */
  #vader { order: 1; } #bors { order: 2; } #nyheter { order: 3; } #lunch { order: 4; }
  section.kort { scroll-margin-top: 56px; }

  /* Snabbmeny – bara på mobil. */
  nav.hopp {
    position: sticky; top: 0; z-index: 1;
    display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none;
    margin: 0 -16px 12px; padding: 8px 16px;
    background: var(--bg);
  }
  nav.hopp a {
    flex: none; font-size: 14px; padding: 5px 12px; border-radius: 999px;
    border: 1px solid var(--linje); background: var(--kort); color: var(--text); text-decoration: none;
  }
  .emoji, .nu .symbol, .dagar .symbol { font-family: "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif; }
  @media (min-width: 820px) {
    .rutnat { flex-direction: row; align-items: flex-start; }
    .kolumn { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
    .kolumn.vanster { flex: 3; } .kolumn.hoger { flex: 2; }
    nav.hopp { display: none; }
  }
  section.kort {
    background: var(--kort);
    border: 1px solid var(--linje);
    border-radius: 14px;
    padding: 18px 18px 14px;
    min-width: 0;
  }
  h2 { margin: 0 0 12px; font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--dampad); }
  .kalla { margin-top: 10px; font-size: 12px; color: var(--dampad); }
  .kalla a { color: inherit; }
  .kalla .tid { opacity: 0.8; }
  .kalla .tid:not(:empty)::before { content: " · "; }
  .fel { color: var(--accent); }

  /* Väder */
  .nu { display: flex; align-items: center; gap: 14px; margin-bottom: 8px; }
  .nu .symbol { font-size: 44px; line-height: 1; }
  .nu .grader { font-size: 40px; font-weight: 600; letter-spacing: -0.03em; }
  .nu .beskr { color: var(--dampad); font-size: 14px; }
  svg.diagram { width: 100%; height: auto; display: block; overflow: visible; }
  svg text { fill: var(--dampad); font-size: 11px; }
  svg .tempetikett { fill: var(--text); font-size: 11.5px; font-weight: 600; }
  .dagar { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 14px; border-top: 1px solid var(--linje); padding-top: 12px; text-align: center; }
  .dagar .namn { font-size: 13px; color: var(--dampad); }
  .dagar .symbol { font-size: 22px; }
  .dagar .mm { font-size: 12px; color: var(--regn); min-height: 1em; }
  .dagar .max { font-weight: 600; }
  .dagar .min { color: var(--dampad); }

  /* Lunch */
  .restaurang { font-weight: 600; margin-bottom: 8px; }
  .ratt { display: flex; gap: 12px; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--linje); }
  .ratt:last-child { border-bottom: 0; }
  .ratt.idag { background: var(--markering); margin: 0 -10px; padding: 8px 10px; border-radius: 8px; border-bottom: 0; }
  .ratt .namn { font-weight: 600; }
  .ratt .beskr { font-size: 14px; color: var(--dampad); }
  .ratt .pris { white-space: nowrap; font-variant-numeric: tabular-nums; }
  .ratt .etikett { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--accent); margin-left: 6px; }
  .rubrik { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--dampad); margin: 14px 0 2px; }
  .info { font-size: 13px; color: var(--dampad); margin-top: 10px; }
  .restaurangblock + .restaurangblock { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--linje); }
  details.hela summary { cursor: pointer; font-size: 14px; color: var(--accent); margin-top: 8px; list-style: none; }
  details.hela summary::-webkit-details-marker { display: none; }
  details.hela summary::before { content: "▸ "; }
  details.hela[open] summary::before { content: "▾ "; }

  /* Nyheter */
  .nyhet { display: block; padding: 8px 0; border-bottom: 1px solid var(--linje); color: inherit; text-decoration: none; }
  .nyhet:last-child { border-bottom: 0; }
  .nyhet:hover .rubriktext { text-decoration: underline; }
  .nyhet .meta { font-size: 12px; color: var(--dampad); }
  .nyhet .kalla-etikett { font-weight: 600; color: var(--accent); margin-right: 6px; }
  .nyhet .rubriktext { font-weight: 600; }
  .nyhet .ingress { font-size: 14px; color: var(--dampad); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .flikar { display: flex; gap: 6px; margin: -4px 0 6px; }
  .flikar button { font: inherit; font-size: 13px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--linje); background: none; color: var(--dampad); cursor: pointer; }
  .flikar button[aria-pressed="true"] { background: var(--text); color: var(--kort); border-color: var(--text); }

  /* Börs */
  .instrument { display: grid; grid-template-columns: 1fr 72px auto; gap: 12px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--linje); }
  .instrument:last-of-type { border-bottom: 0; }
  .instrument .namn { font-weight: 600; }
  .instrument .varde { font-size: 13px; color: var(--dampad); font-variant-numeric: tabular-nums; }
  .instrument .forandring { font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; min-width: 70px; }
  .upp { color: var(--upp); } .ned { color: var(--ned); }
  svg.minidiagram { width: 72px; height: 28px; display: block; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Morgonkoll</h1>
    <div class="datum" id="datum"></div>
    <div class="dagsinfo" id="dagsinfo"></div>
  </header>

  <nav class="hopp" aria-label="Hoppa till">
    <a href="#vader">Väder</a>
    <a href="#bors">Börs</a>
    <a href="#nyheter">Nyheter</a>
    <a href="#lunch">Lunch</a>
  </nav>

  <div class="rutnat">
    <div class="kolumn vanster">
    <section class="kort" id="vader">
      <h2>Väder · Stockholm</h2>
      <div id="vader-innehall">Hämtar prognos…</div>
      <div class="kalla">Källa: <a href="https://www.smhi.se/">SMHI</a> (CC BY 4.0)<span class="tid" id="vader-tid"></span></div>
    </section>

    <section class="kort" id="nyheter">
      <h2>Nyheter</h2>
      <div id="nyheter-innehall">Hämtar rubriker…</div>
      <div class="kalla">Källor: <a href="https://www.svt.se/nyheter/">SVT Nyheter</a>, <a href="https://www.di.se/">Dagens industri</a><span class="tid" id="nyheter-tid"></span></div>
    </section>
    </div>

    <div class="kolumn hoger">
    <section class="kort" id="lunch">
      <h2>Lunch</h2>
      <div id="lunch-innehall">Hämtar menyer…</div>
    </section>

    <section class="kort" id="bors">
      <h2>Börs &amp; valuta</h2>
      <div id="bors-innehall">Hämtar kurser…</div>
      <div class="kalla">Index: Yahoo Finance (fördröjt) · Valuta: <a href="https://www.riksbank.se/">Riksbanken</a><span class="tid" id="bors-tid"></span></div>
    </section>
    </div>
  </div>
</main>

<script>
// Publik nyckel – får ligga här. RLS gör att den bara kan läsa.
const SUPABASE_URL = "https://axmmuhrvvjsgedetibiq.supabase.co";
const SUPABASE_NYCKEL = "sb_publishable_WQdYYO7dKLnKQRzUWVarIQ_QEWiHivu";
const SMHI = "https://opendata-download-metfcst.smhi.se/api/category/snow1g/version/1/geotype/point/lon/18.07/lat/59.33/data.json";

const TIMMAR_I_DIAGRAM = 16;

// --- Hjälpfunktioner ---

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// Datum och timme i svensk tid oavsett var webbläsaren står.
function lokal(tid) {
  const delar = Object.fromEntries(new Intl.DateTimeFormat("sv-SE", {
    timeZone: "Europe/Stockholm", year: "numeric", month: "2-digit", day: "2-digit",
    hour: "2-digit", hourCycle: "h23", weekday: "long",
  }).formatToParts(tid).map(p => [p.type, p.value]));
  return { datum: `${delar.year}-${delar.month}-${delar.day}`, timme: +delar.hour, veckodag: delar.weekday };
}

function isoVecka(tid) {
  const { datum } = lokal(tid);
  const d = new Date(datum + "T12:00:00Z");
  const dag = (d.getUTCDay() + 6) % 7;            // måndag = 0
  d.setUTCDate(d.getUTCDate() - dag + 3);         // veckans torsdag avgör året
  const ar = d.getUTCFullYear();
  const vecka = Math.ceil(((d - Date.UTC(ar, 0, 1)) / 864e5 + 1) / 7);
  return { ar, vecka };
}

// SMHI Wsymb2 (1–27) → emoji och text.
const SYMBOLER = {
  1: ["☀️", "Klart"], 2: ["🌤️", "Nästan klart"], 3: ["⛅", "Växlande molnighet"], 4: ["⛅", "Halvklart"],
  5: ["🌥️", "Molnigt"], 6: ["☁️", "Mulet"], 7: ["🌫️", "Dimma"],
  8: ["🌦️", "Lätta regnskurar"], 9: ["🌦️", "Regnskurar"], 10: ["🌧️", "Kraftiga regnskurar"], 11: ["⛈️", "Åskskurar"],
  12: ["🌨️", "Lätta byar av snöblandat regn"], 13: ["🌨️", "Byar av snöblandat regn"], 14: ["🌨️", "Kraftiga byar av snöblandat regn"],
  15: ["🌨️", "Lätta snöbyar"], 16: ["🌨️", "Snöbyar"], 17: ["🌨️", "Kraftiga snöbyar"],
  18: ["🌧️", "Lätt regn"], 19: ["🌧️", "Regn"], 20: ["🌧️", "Kraftigt regn"], 21: ["⛈️", "Åska"],
  22: ["🌨️", "Lätt snöblandat regn"], 23: ["🌨️", "Snöblandat regn"], 24: ["🌨️", "Kraftigt snöblandat regn"],
  25: ["❄️", "Lätt snöfall"], 26: ["❄️", "Snöfall"], 27: ["❄️", "Kraftigt snöfall"],
};
function symbol(kod, timme) {
  const [emoji, text] = SYMBOLER[kod] || ["·", ""];
  const natt = timme < 6 || timme >= 20;
  return [natt && kod <= 2 ? "🌙" : emoji, text];
}

// Diskret "senast hämtad" i källraden på varje kort.
const senaste = rader => rader.map(r => r.hamtad).filter(Boolean).sort().at(-1);
function visaTid(id, iso, prefix = "") {
  const el = document.getElementById(id);
  if (!el || !iso) return;
  el.textContent = `${prefix} ${tidText(iso)}`.trim();
  el.title = `${prefix ? "Prognosen gjord" : "Senast hämtad"} ${new Date(iso).toLocaleString("sv-SE", { timeZone: "Europe/Stockholm" })}`;
}

// --- Väder ---

async function visaVader() {
  const ruta = document.getElementById("vader-innehall");
  try {
    const svar = await fetch(SMHI);
    if (!svar.ok) throw new Error(`SMHI svarade ${svar.status}`);
    const { timeSeries, createdTime } = await svar.json();
    visaTid("vader-tid", createdTime, "prognos");
    const nu = Date.now() - 30 * 60e3;
    const timmar = timeSeries
      .map(t => ({ tid: new Date(t.time), ...t.data }))
      .filter(t => t.tid >= nu);
    if (!timmar.length) throw new Error("Tom prognos");

    const forsta = timmar[0];
    const [emoji, text] = symbol(forsta.symbol_code, lokal(forsta.tid).timme);
    ruta.innerHTML = `
      <div class="nu">
        <div class="symbol">${emoji}</div>
        <div>
          <div class="grader">${Math.round(forsta.air_temperature)}°</div>
          <div class="beskr">${esc(text)} · vind ${Math.round(forsta.wind_speed)} m/s</div>
        </div>
      </div>
      ${diagram(timmar.slice(0, TIMMAR_I_DIAGRAM))}
      ${dagsoversikt(timmar)}`;
  } catch (e) {
    ruta.innerHTML = `<span class="fel">Kunde inte hämta vädret (${esc(e.message)}).</span>`;
  }
}

function diagram(timmar) {
  const B = 640, H = 210;
  const topp = 40, tempBotten = 130, regnTopp = 142, regnBotten = 186;
  const steg = B / timmar.length;
  const x = i => steg * (i + 0.5);

  const temps = timmar.map(t => t.air_temperature);
  let lag = Math.min(...temps), hog = Math.max(...temps);
  if (hog - lag < 4) { const mitt = (hog + lag) / 2; lag = mitt - 2; hog = mitt + 2; }
  const y = v => tempBotten - (v - lag) / (hog - lag) * (tempBotten - topp - 14);

  const maxRegn = Math.max(2, ...timmar.map(t => t.precipitation_amount_mean));
  const regnH = mm => mm / maxRegn * (regnBotten - regnTopp);

  const punkter = timmar.map((t, i) => [x(i), y(t.air_temperature)]);
  const kurva = punkter.map(([px, py], i) => `${i ? "L" : "M"}${px.toFixed(1)},${py.toFixed(1)}`).join(" ");
  const yta = `${kurva} L${punkter.at(-1)[0].toFixed(1)},${tempBotten} L${punkter[0][0].toFixed(1)},${tempBotten} Z`;

  let delar = "";
  timmar.forEach((t, i) => {
    const timme = lokal(t.tid).timme;
    const varannan = i % 2 === 0;
    const mm = t.precipitation_amount_mean;
    if (mm > 0) {
      const h = Math.max(2, regnH(mm));
      // Svagare stapel om sannolikheten är låg.
      const opacitet = 0.35 + 0.65 * (t.probability_of_precipitation ?? 100) / 100;
      delar += `<rect x="${(x(i) - steg * 0.32).toFixed(1)}" y="${(regnBotten - h).toFixed(1)}" width="${(steg * 0.64).toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="var(--regn)" opacity="${opacitet.toFixed(2)}"><title>${mm} mm, ${t.probability_of_precipitation}% risk</title></rect>`;
    }
    if (varannan) {
      delar += `<text x="${x(i)}" y="22" text-anchor="middle" font-size="22" class="emoji" style="fill:initial">${symbol(t.symbol_code, timme)[0]}</text>`;
      delar += `<text class="tempetikett" x="${x(i)}" y="${(y(t.air_temperature) - 8).toFixed(1)}" text-anchor="middle">${Math.round(t.air_temperature)}°</text>`;
      delar += `<text x="${x(i)}" y="${regnBotten + 18}" text-anchor="middle">${String(timme).padStart(2, "0")}</text>`;
    }
    delar += `<circle cx="${x(i).toFixed(1)}" cy="${y(t.air_temperature).toFixed(1)}" r="${varannan ? 2.6 : 1.6}" fill="var(--temp)"/>`;
  });

  return `
    <svg class="diagram" viewBox="0 0 ${B} ${H}" role="img" aria-label="Temperatur och nederbörd kommande ${timmar.length} timmar">
      <defs><linearGradient id="tempyta" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--temp)" stop-opacity="0.22"/><stop offset="1" stop-color="var(--temp)" stop-opacity="0"/>
      </linearGradient></defs>
      <line x1="0" x2="${B}" y1="${regnBotten}" y2="${regnBotten}" stroke="var(--linje)"/>
      <path d="${yta}" fill="url(#tempyta)"/>
      <path d="${kurva}" fill="none" stroke="var(--temp)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
      ${delar}
      <text x="${B}" y="${regnTopp - 2}" text-anchor="end">mm/h</text>
    </svg>`;
}

function dagsoversikt(timmar) {
  const perDag = new Map();
  for (const t of timmar) {
    const { datum, timme, veckodag } = lokal(t.tid);
    if (!perDag.has(datum)) perDag.set(datum, { veckodag, timmar: [] });
    perDag.get(datum).timmar.push({ ...t, timme });
  }
  const idag = lokal(new Date()).datum;
  const dagar = [...perDag.entries()].filter(([d]) => d !== idag).slice(0, 5);
  return `<div class="dagar">${dagar.map(([, { veckodag, timmar }]) => {
    const temps = timmar.map(t => t.air_temperature);
    const mm = timmar.reduce((s, t) => s + t.precipitation_amount_mean, 0);
    // Symbolen mitt på dagen säger mest.
    const mitt = timmar.reduce((a, b) => Math.abs(b.timme - 13) < Math.abs(a.timme - 13) ? b : a);
    const [emoji, text] = symbol(mitt.symbol_code, 13);
    return `<div title="${esc(text)}">
      <div class="namn">${esc(veckodag.slice(0, 3))}</div>
      <div class="symbol">${emoji}</div>
      <div><span class="max">${Math.round(Math.max(...temps))}°</span> <span class="min">${Math.round(Math.min(...temps))}°</span></div>
      <div class="mm">${mm >= 0.5 ? `${mm.toFixed(mm < 10 ? 1 : 0).replace(".", ",")} mm` : ""}</div>
    </div>`;
  }).join("")}</div>`;
}

// --- Lunch ---

async function supabase(tabell, fraga) {
  const svar = await fetch(`${SUPABASE_URL}/rest/v1/${tabell}?${fraga}`, { headers: { apikey: SUPABASE_NYCKEL } });
  if (!svar.ok) throw new Error(`${tabell}: ${svar.status}`);
  return svar.json();
}

async function visaLunch() {
  const ruta = document.getElementById("lunch-innehall");
  try {
    const [ratter, info] = await Promise.all([
      supabase("lunch", "select=*&order=ar.desc,vecka.desc,id.asc"),
      supabase("lunch_info", "select=*"),
    ]);
    if (!ratter.length) { ruta.textContent = "Inga menyer hämtade än."; return; }

    const { ar, vecka } = isoVecka(new Date());
    const idag = lokal(new Date()).veckodag;
    const vardag = !["lördag", "söndag"].includes(idag);
    // På datorn får menyn plats utfälld, på mobilen visas bara dagens rätter.
    const utfalld = matchMedia("(min-width: 820px)").matches;

    // Senaste veckan per restaurang.
    const perRestaurang = new Map();
    for (const r of ratter) {
      const senaste = perRestaurang.get(r.restaurang);
      if (!senaste) perRestaurang.set(r.restaurang, { ar: r.ar, vecka: r.vecka, ratter: [r] });
      else if (senaste.ar === r.ar && senaste.vecka === r.vecka) senaste.ratter.push(r);
    }

    ruta.innerHTML = [...perRestaurang.entries()].map(([namn, m]) => {
      const aktuell = m.ar === ar && m.vecka === vecka;
      const extra = info.find(i => i.restaurang === namn && i.ar === m.ar && i.vecka === m.vecka);
      const veckans = m.ratter.filter(r => r.sektion === "veckans");
      // Synligt: dagens rätter. Resten (andra dagars specialare, alltid på menyn) under "Hela menyn".
      const visaIdag = vardag && aktuell;
      const dagens = veckans.filter(r => !r.dag || (visaIdag && r.dag === idag));
      const andraDagar = veckans.filter(r => r.dag && !(visaIdag && r.dag === idag));
      const alltid = m.ratter.filter(r => r.sektion === "alltid");
      const ovriga = andraDagar.length + alltid.length;

      const ratt = (r, markera) => `
        <div class="ratt${markera ? " idag" : ""}">
          <div>
            <span class="namn">${esc(r.namn)}</span>${r.dag ? `<span class="etikett">${r.dag === idag && vardag ? "idag" : esc(r.dag)}</span>` : ""}
            ${r.beskrivning ? `<div class="beskr">${esc(r.beskrivning)}</div>` : ""}
          </div>
          <div class="pris">${r.pris ? `${r.pris} kr` : ""}</div>
        </div>`;

      return `<div class="restaurangblock">
        <div class="restaurang">${esc(namn)}</div>
        ${aktuell ? "" : `<div class="info fel">Visar vecka ${m.vecka} – veckans meny är inte hämtad än.</div>`}
        <div class="rubrik">${visaIdag ? `Idag, ${idag}` : `Vecka ${m.vecka}`}</div>
        ${dagens.map(r => ratt(r, visaIdag && r.dag === idag)).join("")}
        ${ovriga ? `<details class="hela"${utfalld ? " open" : ""}>
          <summary>Hela menyn (${ovriga} rätter till)</summary>
          ${andraDagar.length ? `<div class="rubrik">${visaIdag ? "Andra dagar" : "Vissa dagar"}</div>${andraDagar.map(r => ratt(r)).join("")}` : ""}
          ${alltid.length ? `<div class="rubrik">Alltid på menyn</div>${alltid.map(r => ratt(r)).join("")}` : ""}
        </details>` : ""}
        ${extra?.info?.length ? `<div class="info">${extra.info.map(esc).join(" · ")}</div>` : ""}
        ${extra?.kalla ? `<div class="kalla"><a href="${esc(extra.kalla)}">Meny som PDF</a>${extra.hamtad ? `<span class="tid" title="Senast hämtad">${tidText(extra.hamtad)}</span>` : ""}</div>` : ""}
      </div>`;
    }).join("");
  } catch (e) {
    ruta.innerHTML = `<span class="fel">Kunde inte hämta lunchmenyer (${esc(e.message)}).</span>`;
  }
}

// --- Nyheter ---

const ANTAL_NYHETER = 10;

function tidText(iso) {
  const tid = new Date(iso);
  const klocka = tid.toLocaleTimeString("sv-SE", { timeZone: "Europe/Stockholm", hour: "2-digit", minute: "2-digit" });
  const dagar = Math.round((new Date(lokal(new Date()).datum) - new Date(lokal(tid).datum)) / 864e5);
  return dagar === 0 ? klocka : dagar === 1 ? `igår ${klocka}` : `${lokal(tid).veckodag} ${klocka}`;
}

async function visaNyheter() {
  const ruta = document.getElementById("nyheter-innehall");
  try {
    const artiklar = await supabase("nyheter", "select=kalla,rubrik,ingress,lank,publicerad,hamtad&order=publicerad.desc&limit=80");
    visaTid("nyheter-tid", senaste(artiklar));
    if (!artiklar.length) { ruta.textContent = "Inga rubriker hämtade än."; return; }
    const kallor = ["Alla", ...new Set(artiklar.map(a => a.kalla))];
    let vald = "Alla";
    try { vald = localStorage.getItem("nyhetskalla") || "Alla"; } catch {}
    if (!kallor.includes(vald)) vald = "Alla";

    const rita = () => {
      const urval = artiklar.filter(a => vald === "Alla" || a.kalla === vald).slice(0, ANTAL_NYHETER);
      ruta.innerHTML = `
        <div class="flikar">${kallor.map(k => `<button type="button" data-kalla="${esc(k)}" aria-pressed="${k === vald}">${esc(k)}</button>`).join("")}</div>
        ${urval.map((a, i) => `
          <a class="nyhet" href="${esc(a.lank)}" target="_blank" rel="noopener">
            <div class="meta"><span class="kalla-etikett">${esc(a.kalla)}</span>${tidText(a.publicerad)}</div>
            <div class="rubriktext">${esc(a.rubrik)}</div>
            ${i < 3 && a.ingress ? `<div class="ingress">${esc(a.ingress)}</div>` : ""}
          </a>`).join("")}`;
      ruta.querySelectorAll(".flikar button").forEach(b => b.onclick = () => {
        vald = b.dataset.kalla;
        try { localStorage.setItem("nyhetskalla", vald); } catch {}
        rita();
      });
    };
    rita();
  } catch (e) {
    ruta.innerHTML = `<span class="fel">Kunde inte hämta nyheter (${esc(e.message)}).</span>`;
  }
}

// --- Börs ---

const tal = (v, dec) => Number(v).toLocaleString("sv-SE", { minimumFractionDigits: dec, maximumFractionDigits: dec });

function minidiagram(historik, klass) {
  const v = historik.map(h => h[1]);
  if (v.length < 2) return "";
  const lag = Math.min(...v), hog = Math.max(...v), B = 72, H = 28;
  const pkt = v.map((x, i) => `${(i / (v.length - 1) * B).toFixed(1)},${(H - 2 - (x - lag) / (hog - lag || 1) * (H - 4)).toFixed(1)}`);
  return `<svg class="minidiagram ${klass}" viewBox="0 0 ${B} ${H}" aria-hidden="true"><polyline points="${pkt.join(" ")}" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>`;
}

async function visaBors() {
  const ruta = document.getElementById("bors-innehall");
  try {
    const rader = await supabase("bors", "select=*");
    visaTid("bors-tid", senaste(rader));
    if (!rader.length) { ruta.textContent = "Inga kurser hämtade än."; return; }
    const ordning = ["^OMX", "^GSPC", "^IXIC", "^GDAXI", "SEKUSDPMI", "SEKEURPMI"];
    rader.sort((a, b) => ordning.indexOf(a.symbol) - ordning.indexOf(b.symbol));
    ruta.innerHTML = rader.map(r => {
      const p = Number(r.forandring_pct);
      const klass = p > 0 ? "upp" : p < 0 ? "ned" : "";
      const pil = p > 0 ? "▲" : p < 0 ? "▼" : "";
      const datum = new Date(r.datum + "T12:00:00Z").toLocaleDateString("sv-SE", { day: "numeric", month: "short" });
      return `
        <div class="instrument" title="Senast ${esc(r.datum)} · ${esc(r.kalla)}">
          <div>
            <div class="namn">${esc(r.namn)}</div>
            <div class="varde">${tal(r.varde, r.typ === "valuta" ? 3 : 0)} · ${datum}</div>
          </div>
          ${minidiagram(r.historik, klass)}
          <div class="forandring ${klass}">${pil} ${tal(Math.abs(p), 2)} %</div>
        </div>`;
    }).join("");
  } catch (e) {
    ruta.innerHTML = `<span class="fel">Kunde inte hämta kurser (${esc(e.message)}).</span>`;
  }
}

// --- Dagen: namnsdag, helgdag, flaggdag och temadagar ---

// Svenska dagar-API:et (öppet, tillåter anrop från webbläsaren).
const DAGAR_API = "https://sholiday.faboul.se/dagar/v2.1/";

// Temadagar som inte finns i API:et. Fyll gärna på – nyckeln är "MM-DD".
const TEMADAGAR = {
  "01-13": "Tjugondag Knut",
  "02-14": "Alla hjärtans dag ❤️",
  "03-08": "Internationella kvinnodagen",
  "03-14": "Pi-dagen π",
  "03-25": "Våffeldagen 🧇",
  "04-01": "Första april 🤡",
  "04-30": "Valborgsmässoafton 🔥",
  "05-04": "Star Wars-dagen ✨",
  "10-01": "Kaffets dag ☕",
  "10-04": "Kanelbullens dag 🥐",
  "10-31": "Halloween 🎃",
  "11-07": "Kladdkakans dag 🍫",
  "11-10": "Mårtensafton 🦢",
  "12-09": "Pepparkakans dag 🍪",
  "12-13": "Lucia 🕯️",
};

// Temadagar som flyttar sig från år till år.
function rorligaTemadagar(ar) {
  const d = (m, dag) => new Date(Date.UTC(ar, m - 1, dag));
  const nyckel = t => t.toISOString().slice(5, 10);
  const plus = (t, dagar) => new Date(t.getTime() + dagar * 864e5);
  // n:te veckodagen i månaden (n = -1 → sista). veckodag: 0 = söndag.
  const nte = (m, veckodag, n) => {
    if (n > 0) { const f = d(m, 1); return plus(f, (veckodag - f.getUTCDay() + 7) % 7 + (n - 1) * 7); }
    const s = d(m + 1, 0); return plus(s, -((s.getUTCDay() - veckodag + 7) % 7));
  };
  // Påskdagen (gregoriansk algoritm).
  const a = ar % 19, b = Math.floor(ar / 100), c = ar % 100, e = Math.floor(b / 4), f = b % 4;
  const g = Math.floor((b - Math.floor((b + 8) / 25) + 1) / 3), h = (19 * a + b - e - g + 15) % 30;
  const i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * f + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451);
  const pask = d(Math.floor((h + l - 7 * m + 114) / 31), ((h + l - 7 * m + 114) % 31) + 1);
  const forstaAdvent = plus(d(12, 25), -((d(12, 25).getUTCDay() || 7) + 21));

  return {
    [nyckel(plus(pask, -47))]: "Fettisdagen – semmeldags 🧁",
    [nyckel(nte(5, 0, -1))]: "Mors dag 💐",
    [nyckel(nte(8, 4, 3))]: "Surströmmingspremiär 🐟",
    [nyckel(nte(11, 0, 2))]: "Fars dag",
    [nyckel(plus(nte(11, 4, 4), 1))]: "Black Friday 🛍️",
    [nyckel(forstaAdvent)]: "Första advent 🕯️",
    [nyckel(plus(forstaAdvent, 7))]: "Andra advent 🕯️",
    [nyckel(plus(forstaAdvent, 14))]: "Tredje advent 🕯️",
    [nyckel(plus(forstaAdvent, 21))]: "Fjärde advent 🕯️",
  };
}

async function visaDagen() {
  const ruta = document.getElementById("dagsinfo");
  const datum = lokal(new Date()).datum;
  const [ar, man, dag] = datum.split("-");
  const delar = [];

  try {
    const svar = await fetch(`${DAGAR_API}${ar}/${man}/${dag}`);
    const info = (await svar.json()).dagar?.[0] || {};
    if (info.helgdag) delar.push([info.helgdag, true]);
    if (info.flaggdag) delar.push([`Flaggdag: ${info.flaggdag}`, false]);
    if (info.namnsdag?.length) delar.unshift([`Namnsdag: ${info.namnsdag.join(", ")}`, false]);
  } catch {}   // API:et nere – visa bara temadagarna

  const tema = TEMADAGAR[`${man}-${dag}`] || rorligaTemadagar(+ar)[`${man}-${dag}`];
  if (tema && !delar.some(([t]) => t.startsWith(tema.split(" ")[0]))) delar.push([tema, true]);

  ruta.innerHTML = delar.map(([t, speciell]) => `<span${speciell ? ' class="speciell"' : ""}>${esc(t)}</span>`).join("");
}
